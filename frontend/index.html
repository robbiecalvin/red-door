<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      if (location.protocol === "http:" &&
          (location.hostname === "badehausx.com" || location.hostname === "www.badehausx.com")) {
        const secureUrl = new URL(location.href);
        secureUrl.protocol = "https:";
        secureUrl.hostname = "badehausx.com";
        secureUrl.port = "";
        location.replace(secureUrl.href);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Badehaus X</title>
    <meta name="theme-color" content="#101014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Badehaus X" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <meta name="description" content="Explore nearby. Start a conversation. Connect your way with Badehaus X." />
    <link rel="canonical" href="https://badehausx.com/" />

    <!-- Static preview metadata: messaging crawlers do not need to run JavaScript. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Badehaus X" />
    <meta property="og:title" content="Badehaus X" />
    <meta property="og:description" content="Explore nearby. Start a conversation. Connect your way." />
    <meta property="og:url" content="https://badehausx.com/" />
    <meta property="og:image" content="https://badehausx.com/social/badehaus-x-share-v1.png" />
    <meta property="og:image:secure_url" content="https://badehausx.com/social/badehaus-x-share-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1734" />

    <meta property="og:image:alt" content="A glowing doorway beside the Badehaus X wordmark." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Badehaus X" />
    <meta name="twitter:description" content="Explore nearby. Start a conversation. Connect your way." />

  </head>
