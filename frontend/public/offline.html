<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101014">
    <title>Red Door — Reconnect</title>
    <style>
        body {
            margin: 0;
            background: #101014;
            color: #f5eef0;
            font: 18px/1.6 system-ui, sans-serif;
            min-height: 100dvh;
            display: grid;
            place-items: center
        }

        main {
            max-width: 28rem;
            padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))
        }

        img {
            width: 80px;
            border-radius: 18px
        }

        h1 {
            line-height: 1.2
        }

        p {
            color: #cec1c7
        }

        button {
            background: #bc243b;
            color: white;
            border: 0;
            border-radius: 12px;
            padding: 14px 24px;
            font: inherit;
            cursor: pointer;
            min-height: 44px
        }

        small {
            display: block;
            margin-top: 20px;
            color: #b5a7af
        }
    </style>
</head>

<body>
    <main><img src="./icons/icon-192.png" alt="Red Door">
        <h1>Let’s reconnect.</h1>
        <p>Red Door needs an internet connection to sign in, load people, and send messages.</p>
        <p>Check your connection, then try again. Nothing is sent from this offline page.</p><button id="retry"
            type="button">Try again</button><small>Your private conversations and photos aren’t stored in the app’s
            offline cache.</small>
    </main>
    <script src="./offline.js" defer></script>
</body>

</html>
