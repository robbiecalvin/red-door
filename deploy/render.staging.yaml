# Review costs and current Render schema in the dashboard before creating anything.
# This file has not been deployed. Never attach the production database or keys.
services:
  - type: web
    name: red-door-standalone-staging
    runtime: node
    plan: starter
    numInstances: 1
    autoDeploy: false
    buildCommand: npm ci --omit=dev
    startCommand: npm run backend
    healthCheckPath: /health
    disk:
      name: standalone-staging-data
      mountPath: /opt/render/project/src/backend/.data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: REDDOOR_ENV
        value: staging
      - key: JWT_SECRET
        generateValue: true
      - key: REQUIRE_DATABASE
        value: 'true'
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PLUS_PRICE_ID
        sync: false
