name: CI

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Ensure media test tools are installed
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Run Tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Check PWA installation, offline privacy and updates
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROMIUM_PATH" ]; then
            echo "A system Chromium browser is required for the PWA checks."
            exit 1
          fi
          npm run test:pwa

      - name: Production-only backend startup
        run: npm run test:production

      - name: Dependency vulnerability audit (high+)
        run: npm audit --omit=dev --audit-level=high
