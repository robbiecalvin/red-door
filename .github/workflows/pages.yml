name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 18 20,22,24,26 11 *"
    - cron: "0 18 1,3,8,10 12 *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  release-window:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.window.outputs.deploy }}
    steps:
      - id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          today=$(date -u +%F)
          if [[ "$EVENT_NAME" != "schedule" || ( "$today" > "2026-11-19" && "$today" < "2026-12-11" ) ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release-window
    if: needs.release-window.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web site from source
        env:
          DUALMODE_PUBLIC_APP_URL: https://badehausx.com/
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          touch dist/.nojekyll
          echo "${GITHUB_SHA}" > dist/build-sha.txt

      - name: Configure Pages (official action)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Apply the Badehaus X custom domain (best effort)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request("PUT /repos/{owner}/{repo}/pages", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: "workflow",
                cname: "badehausx.com"
              });
              core.notice("GitHub Pages accepted badehausx.com as the custom domain.");
            } catch (error) {
              core.warning(`GitHub Pages did not accept the domain update from the Actions token: ${error.message}`);
            }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 30
          reporting_interval: 10000
